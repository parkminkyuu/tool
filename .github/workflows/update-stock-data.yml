name: Update stock price data

on:
  schedule:
    - cron: "0 18 * * 0" # Sunday 18:00 UTC (~Monday 03:00 KST)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/fetch-stock-data.mjs

      - name: Commit if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/stock-prices.json
          git diff --staged --quiet || git commit -m "chore: update stock price data"
          git push
